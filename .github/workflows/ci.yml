name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned real producer
        uses: actions/checkout@v4
        with:
          repository: dababiyoda/DALEOBANKS
          ref: 18f1989cacdb9b938cb98a28c22b2eab757ce5b9
          path: .compat/daleobanks
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          # --no-deps keeps the heavy optional stack (tensorflow, transformers,
          # celery, redis) out of CI; install only what the test suite imports.
          pip install fastapi httpx structlog sqlalchemy python-dotenv prometheus-client 'python-jose[cryptography]>=3.5.0' uvicorn
          pip install pytest pytest-asyncio ruff
          # One canonical, content-pinned Kernel boundary implementation.
          pip install 'uniimente-kernel-boundaries @ https://github.com/dababiyoda/uniimente-kernel/archive/4999acff1a69502c05af455fbccfca380cad18ee.tar.gz'
      - name: Lint
        run: |
          ruff check . --exit-zero
      - name: Test
        env:
          DALEOBANKS_SOURCE: ${{ github.workspace }}/.compat/daleobanks
        run: |
          pytest -q tests
